name: Verify and publish Detour

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - deploy/kustomization.yaml
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Build generates Next.js route declarations needed by a clean typecheck.
      - run: npm run build
      - run: npm run typecheck

  image:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'aaishikasb/cloud-native-hackathon'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/aaishikasb/cloud-native-hackathon:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Update the GitOps image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Build output is committed on top of current main, as in the Radar starter.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          tag = os.environ["IMAGE_TAG"]
          if not re.fullmatch(r"[0-9a-f]{40}", tag):
              raise SystemExit("Expected a full Git commit SHA")
          path = Path("deploy/kustomization.yaml")
          content, count = re.subn(r"(?m)^(\s+newTag:).*$", lambda match: f'{match[1]} "{tag}"', path.read_text())
          if count != 1:
              raise SystemExit("Expected one GitOps image tag")
          path.write_text(content)
          PY
            if git diff --quiet -- deploy/kustomization.yaml; then exit 0; fi
            git add deploy/kustomization.yaml
            git commit -qm "deploy: ${IMAGE_TAG} [skip ci]"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 3))"
          done
          echo "Could not update the GitOps image after five attempts." >&2
          exit 1
